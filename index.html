<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ココヤ。| 自然・アウトドア・旅</title>
    <style>
        body { margin: 0; padding: 0; font-family: "Times New Roman", Georgia, "Yu Mincho", serif; background-color: #F8F7F0; color: #2B2B2B; line-height: 2; }

        /* --- ヘッダー・ロゴ --- */
        .site-header { position: fixed; top: 30px; left: 30px; z-index: 100; }
        .logo-img { width: 120px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

        /* --- 没入型メインビジュアル --- */
        .hero-parallax {
            height: 100vh;
            background-image: url('フィッツロイ.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .hero-text {
            color: white;
            font-size: 2rem;
            letter-spacing: 0.3em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            animation: fadeOut 2s ease-out forwards;
            animation-delay: 1.5s;
        }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        .container { max-width: 840px; margin: 0 auto; padding: 100px 20px; }
        .concept-section { margin-bottom: 100px; text-align: center; }
        
        /* --- YouTubeアイコン --- */
        .yt-icon {
            display: inline-block; width: 60px; height: 60px;
            background: #AA2222; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .yt-icon:hover { transform: scale(1.1); }
        .yt-icon::after { content: "▶"; color: white; font-size: 20px; margin-left: 3px; }

        .gallery { display: flex; flex-direction: column; gap: 80px; }
        .gallery-item { display: block; text-decoration: none; color: inherit; transition: 0.6s; }
        .image-wrapper { width: 100%; height: 0; padding-bottom: 45%; position: relative; overflow: hidden; }
        .gallery-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        footer { text-align: center; padding: 80px 20px; background-color: #3E4B24; color: #F8F7F0; }
        .sns-link { color: #F8F7F0; margin: 0 15px; opacity: 0.7; }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="ココヤロゴ.jpg" alt="ココヤ。" class="logo-img">
    </header>

    <div class="hero-parallax">
        <div class="hero-text">旅が人生を作る</div>
    </div>

    <div class="container">
        <div class="concept-section">
            <div style="font-size: 1.5rem; color: #3E4B24; margin-bottom: 30px;">かえるコヤ、つどうコヤ、ココヤ。</div>
            <p>阿蘇の美しい自然の中に佇む、手作りのAフレーム小屋「ココヤ。」。<br>私たちは、壮大なロングトレイルへの旅や、自然と調和するシンプルな暮らしの魅力を、言葉と映像を通じて発信しています。</p>
        </div>

        <div style="text-align: center; margin-bottom: 100px;">
            <p>Journal / YouTube</p>
            <a href="https://www.youtube.com/@cocoya-japan" target="_blank" class="yt-icon"></a>
        </div>

        <div class="gallery">
            <a href="https://www.youtube.com/watch?v=IcW8AVSCxs0&t=1s" target="_blank" class="gallery-item">
                <div class="image-wrapper"><img src="PCTロゴ.jpg" alt="PCT"></div>
                <div class="item-title">アメリカ縦断 4,265km の旅</div>
            </a>
            <a href="https://www.youtube.com/watch?v=c-nClJFv5ww" target="_blank" class="gallery-item">
                <div class="image-wrapper"><img src="小屋建築.jpg" alt="小屋"></div>
                <div class="item-title">南阿蘇でAフレームの小屋作り</div>
            </a>
        </div>
    </div>

    <footer>
        <div class="sns-container">
            <a href="https://www.instagram.com/hiker_naoki/" class="sns-link">Instagram</a>
            <a href="https://www.threads.com/@hiker_naoki?hl=ja" class="sns-link">Threads</a>
        </div>
    </footer>
</body>
</html>
