<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ココヤ。| 自然・アウトドア・旅</title>
    <style>
        /* 全体の設定（アースカラーを基調に） */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #FAFAED; /* 優しいアイボリー色 */
            color: #333333;
            line-height: 1.6;
        }

        /* ヘッダー・ロゴ部分 */
        header {
            text-align: center;
            padding: 40px 20px;
            background-color: #ffffff;
            border-bottom: 2px solid #EBEBDB;
        }
        .logo-img {
            max-width: 250px; /* ロゴの大きさを調整 */
            height: auto;
        }

        /* メインコンテンツ */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* YouTubeへのリンクボタン */
        .youtube-section {
            margin-bottom: 60px;
        }
        .youtube-btn {
            display: inline-block;
            background-color: #CC0000; /* YouTubeの赤 */
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 30px;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .youtube-btn:hover {
            background-color: #ff0000;
        }
        .youtube-btn span {
            margin-right: 10px;
        }

        /* 画像ギャラリー部分（フィッツロイと阿蘇山） */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .gallery-item {
            flex: 1 1 300px; /* スマホでは縦並び、PCでは横並び */
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }
        .gallery-item p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #4A5D23; /* 森の緑色 */
        }

        /* フッター */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #4A5D23; /* 森の緑色 */
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <img src="ココヤロゴ.jpg" alt="ココヤ。 かえるコヤつどうコヤ" class="logo-img">
    </header>

    <div class="container">
        <div class="youtube-section">
            <h2>YouTubeで旅の様子をお届けしています</h2>
            <p>小屋建築やロングトレイルの魅力をYouTubeで発信中！ぜひご覧ください。</p>
            <br>
            <a href="https://www.youtube.com/@cocoya-japan" target="_blank" rel="noopener noreferrer" class="youtube-btn">
                <span>▶︎</span> YouTubeチャンネルを見る
            </a>
        </div>

        <div class="gallery">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1544198365-f5d60b6d8190?q=80&w=800&auto=format&fit=crop" alt="フィッツロイ（仮）">
                <p>パタゴニア・フィッツロイ</p>
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1596425316584-3c82e0e47192?q=80&w=800&auto=format&fit=crop" alt="阿蘇山（仮）">
                <p>熊本・阿蘇山</p>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ココヤ。 All Rights Reserved.
    </footer>

</body>
</html>
