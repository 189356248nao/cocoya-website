<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ココヤ。| 自然・アウトドア・旅</title>
    <style>
        body { margin: 0; padding: 0; font-family: "Times New Roman", Georgia, "Yu Mincho", serif; background-color: #F8F7F0; color: #2B2B2B; line-height: 2; }

        /* --- ヘッダー・ロゴ --- */
        .site-header { position: fixed; top: 30px; left: 30px; z-index: 100; }
        .logo-img { width: 120px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

        /* --- 没入型メインビジュアル --- */
        .hero-parallax {
            height: 100vh;
            background-image: url('フィッツロイ.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .hero-text {
            color: white; font-size: 2rem; letter-spacing: 0.3em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            animation: fadeOut 2s ease-out forwards; animation-delay: 1.5s;
        }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        .container { max-width: 1100px; margin: 0 auto; padding: 100px 20px; }
        
        /* --- 3カラム横並びギャラリー --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-top: 50px;
        }
        @media (max-width: 768px) { .gallery { grid-template-columns: 1fr; } }

        .gallery-item { display: block; text-decoration: none; color: inherit; transition: 0.4s; }
        .gallery-item:hover { transform: translateY(-10px); }
        .image-wrapper { width: 100%; height: 220px; overflow: hidden; border-radius: 2px; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .item-title { font-size: 0.95rem; font-weight: 500; margin-top: 15px; letter-spacing: 0.05em; }

        /* --- モダンYouTubeアイコン --- */
        .yt-section { text-align: center; margin: 100px 0; }
        .yt-btn {
            display: inline-block; width: 140px; height: 50px;
            border: 1px solid #2B2B2B;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: #2B2B2B; font-size: 0.8rem;
            letter-spacing: 0.2em; transition: 0.4s;
        }
        .yt-btn:hover { background: #2B2B2B; color: #F8F7F0; }

        footer { text-align: center; padding: 80px 20px; background-color: #3E4B24; color: #F8F7F0; }
        .sns-link { color: #F8F7F0; margin: 0 15px; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="ココヤロゴ.jpg" alt="ココヤ。" class="logo-img">
    </header>

    <div class="hero-parallax">
        <div class="hero-text">旅が人生を作る</div>
    </div>

    <div class="container">
        <div style="text-align: center; margin-bottom: 80px;">
            <div style="font-size: 1.5rem; color: #3E4B24; margin-bottom: 20px;">かえるコヤ、つどうコヤ、ココヤ。</div>
            <p style="max-width: 600px; margin: 0 auto;">阿蘇の美しい自然の中に佇む、手作りのAフレーム小屋「ココヤ。」。私たちは、壮大なロングトレイルへの旅や、自然と調和するシンプルな暮らしの魅力を発信しています。</p>
        </div>

        <div class="yt-section">
            <a href="https://www.youtube.com/@cocoya-japan" target="_blank" class="yt-btn">YOUTUBE</a>
        </div>

        <div class="gallery">
            <a href="https://www.youtube.com/watch?v=IcW8AVSCxs0&t=1s" target="_blank" class="gallery-item">
                <div class="image-wrapper"><img src="PCTロゴ.jpg" alt="PCT"></div>
                <div class="item-title">アメリカ縦断 4,265km の旅</div>
            </a>
            <a href="https://www.youtube.com/watch?v=c-nClJFv5ww" target="_blank" class="gallery-item">
                <div class="image-wrapper"><img src="小屋建築.jpg" alt="小屋"></div>
                <div class="item-title">南阿蘇でAフレームの小屋作り</div>
            </a>
            <a href="https://www.youtube.com/watch?v=hJyhrh0phZw" target="_blank" class="gallery-item">
                <div class="image-wrapper"><img src="paine.jpg" alt="パタゴニア"></div>
                <div class="item-title">パタゴニアの壮大な旅路</div>
            </a>
        </div>
    </div>

    <footer>
        <div class="sns-container">
            <a href="https://www.instagram.com/hiker_naoki/" class="sns-link">INSTAGRAM</a>
            <a href="https://www.threads.com/@hiker_naoki?hl=ja" class="sns-link">THREADS</a>
        </div>
    </footer>
</body>
</html>
